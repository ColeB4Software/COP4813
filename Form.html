<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="Description" content="Cole Bryant's COP4813 Web Systems Login In">
        <meta name="keywords" content="COP4813, Login In, Cole Bryant, Web Systems">
        <meta name="author" content="Cole Bryant">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <Title>COP4813 Website: Cole Bryant</Title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <h1>Login In Information</h1>

    <ul class="menu">
        <li><a href="Form.html">Login In</a></li>
        <li><a href="index.html">Menu</a></li>
        <li><a href="Assignment.html">Class Assignments</a></li>
        <li><a href="Help.html">Programming Resources</a></li>
    </ul>
</head>
<body> 
    <form id="loginForm" action='mailto:4colesiphone@gmail.com' method="post" enctype='text/plain' novalidate>
    <fieldset>
        <legend>Personal Information: </legend> <br/>
            <label for='firstname'>First Name: </label>
            <input type="text" id="firstname" name="firstname" required
            aria-describedby="firstname-error">
            <span class="error" id="firstname-error"></span>
            <br/>

            <label for='lastname'>Last Name: </label>
            <input type="text" id="lastname" name="lastname" required
            aria-describedby="lastname-error">
            <span class="error" id="lastname-error"></span>
            <br/>

            <label for="birthdate">Birthday: </label>
            <input type="date" id="birthdate" name="birthdate" required
            aria-describedby="birthdate-error">
            <span class="error" id="birthdate-error"></span>
        </fieldset>


        <fieldset>
            <legend>Address: </legend> <br/>
                <label for='address'>Home Address:</label>
                <input type="text" id="address" name="address" required
                aria-describedby="address-error">
                <span class="error" id="address-error"></span>
                <br/>

                <label for='city'>City: </label>
                <input type="text" id="city" name="city" required
                aria-describedby="city-error">
                <span class="error" id="city-error"></span>
                <br/>

                <label for='state'>State: </label>
                <input type="text" id="state" name="state" required
                aria-describedby="state-error">
                <span class="error" id="state-error"></span>
                <br/>

                <label for='zip'>Zip Code: </label>
                <input type="text" id="zip" name="zip" required
                aria-describedby="zip-error">
                <span class="error" id="zip-error"></span>
            </fieldset>
     
    <fieldset>
        <legend>Contact Information: </legend> <br/>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
            aria-describedby="phone-error">
                <span class="error" id="phone-error"></span>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required 
            pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}$"
            aria-describedby="email-error">
                <span class="error" id="email-error"></span>
    </fieldset>

    <fieldset>
        <legend>Message:</legend> <br/>
        <label for="message"> </label>
        <textarea id="message" name="message" rows="10" required></textarea>
        <span class="error" id="message-error"></span>
    </fieldset>

    <fieldset>
        <legend>Security Check: What is 4 + 8?</legend> <br/>
        <label for='sec'>Answer: </label>
        <input type="text" id="sec" name="sec" required
                aria-describedby="sec-error">
        <span class="error" id="sec-error"></span>
    </fieldset>

    <fieldset>
        <h>Confirmation: </h> <br/>
    <button type="submit">Submit Form</button>
    <button type="reset">Clear Form</button>
    </fieldset>
</form>
    <script>
        //Form
        const form = document.getElementById('loginForm');

        //Submit
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            //prevents form based on errors
            let isValid = true;
            document.querySelectorAll('.error').forEach(function (error) {
                error.textContent = '';
            });
        

//Personal Info
        //firstname
        const firstname = document.getElementById('firstname').value.trim();
        if (!firstname){
            document.getElementById('firstname-error').textContent = 'First name is required';
            isValid = false;
        } else if (!/^[a-zA-Z]+$/.test(firstname)) {
                document.getElementById('firstname-error').textContent = 'Please enter your first name';
                isValid = false;
        }


        //lastname
        const lastname = document.getElementById('lastname').value.trim();
        if (!lastname){
            document.getElementById('lastname-error').textContent = 'Last name is required';
            isValid = false;
        } else if (!/^[a-zA-Z\s'-]+$/.test(lastname)){
            document.getElementById('lastname-error').textContent = 'Please enter your last name';
            isValid = false;    
        }
                
        //birthdate
        const birthdate = document.getElementById('birthdate').value.trim();
        if (!birthdate){
            document.getElementById('birthdate-error').textContent = 'Birthday is required';
            isValid = false;
        } else if (new Date(birthdate) > new Date()) {
                document.getElementById('birthdate-error').textContent = 'Birthday cannot be in the future';
                isValid = false;
        }
        
        //Address
        //Home Address
        const address = document.getElementById('address').value.trim();
        if (!address){
            document.getElementById('address-error').textContent = 'Address is required';
            isValid = false;
        } 

        //City
        const city = document.getElementById('city').value.trim();
        if (!city){
            document.getElementById('city-error').textContent = 'City is required';
            isValid = false;
        } 

        //State
        const state = document.getElementById('state').value.trim();
        if (!state){
            document.getElementById('state-error').textContent = 'State is required';
            isValid = false;
        } 


        //ZipCode
        const zip = document.getElementById('zip').value.trim();
        if (!zip || !/^\d{5}$/.test(zip)){
            document.getElementById('zip-error').textContent = 'Zip code is required';
            isValid = false;
        } 

        //Contact Info
        //Phone validation
        const phone = document.getElementById('phone').value.trim();
        if (!phone || !/^\(\d{3}\)\s?\d{3}-\d{4}$/.test(phone)) {
            document.getElementById('phone-error').textContent = 'Phone number is required';
            isValid = false;
        } 

        //email validation
        const email = document.getElementById('email').value.trim();
        if (!email || !/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$/.test(email)) {
            document.getElementById('email-error').textContent = 'Email is required';
            isValid = false;
        } 

        //Message
        const message = document.getElementById('message').value.trim();
        if (!message) {
            document.getElementById('message-error').textContent = 'Message is required'
            isValid = false;
        }

        //Security check
        const securityanswer = document.getElementById('sec').value.trim();
        if  (securityanswer !== '12') {
            document.getElementById('sec-error').textContent = 'Incorrect answer';
            isValid = false;
        }


        //Confirmation
        if (!isValid) {
            return;
        }
            sessionStorage.setItem('firstname', firstname);
            sessionStorage.setItem('lastname', lastname);
            sessionStorage.setItem('birthdate', birthdate);
            sessionStorage.setItem('address', address);
            sessionStorage.setItem('city', city);
            sessionStorage.setItem('state', state);
            sessionStorage.setItem('zip', zip);
            sessionStorage.setItem('phone', phone);
            sessionStorage.setItem('email', email);
            sessionStorage.setItem('message', message);

            window.location.href = 'confirm.html';

        });
    </script>

    <footer> <P>2026 Cole Bryant | COP4813 Web Systems </P> </footer>
</body>
</html>
