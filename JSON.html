<body>
<section>
<p>This table displays an example of a list of football players</p>
<br/>
<h>Football Player Information:</h>
</section>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Nationality</th>
            <th>Age</th>
            <th>Position</th>
            <th>Team</th>
            <th>Jersey Number</th>
            <th>Games Played</th>
        </tr>
    </thead>

    <tbody id="playTable">
    </tbody>
</table>

<script>
    // Fetch does not recieve files, only websites. file->no https->yes
    fetch("myjson.json")
    .then(response => response.json())
    .then(myjson => {
        const table = document.getElementById("playTable");

        myjson.players.forEach(player => {

            const row = document.createElement("tr");

// ` Is included in the program, since it will hel move data into the tables.
            row.innerHTML = `
            <td>${player.PlayerID}</td>
            <td>${player.firstName}</td>
            <td>${player.lastName}</td>
            <td>${player.nationality}</td>
            <td>${player.age}</td>
            <td>${player.position}</td>
            <td>${player.team}</td>
            <td>${player.jerseyNumber}</td>
            <td>${player.gamesPlayed}</td>
            `;

            table.appendChild(row);

        });
    })
</script>
</body>
