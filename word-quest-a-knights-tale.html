    var headline = GP.el('p', 'gp-score');
    // A game against the computer says the match ("You 4 · Computer 2"); the result line still
    // carries score and max (Fractazmic, 2026-09-25).
    headline.appendChild(GP.el('strong', null, options && options.headline ? options.headline : score + ' out of ' + max));
    headline.appendChild(document.createTextNode(' · ' + GP.clock(seconds)));
    card.appendChild(headline);

    if (player) {
      card.appendChild(GP.el('p', 'gp-who', player));
    }

    if (detail && detail.length) {
      var review = GP.el('div', 'gp-review');
      review.appendChild(GP.el('h3', null, options && options.reviewHeading ? options.reviewHeading : 'What you answered'));
      var list = GP.el('ul', 'gp-review-list');
      detail.forEach(function (line) {
        var item = GP.el('li', line.ok ? 'gp-ok' : 'gp-miss');
        item.appendChild(GP.el('span', 'gp-mark', line.ok ? '✓' : '✗'));
        item.appendChild(GP.el('span', 'gp-review-text', line.label));
        list.appendChild(item);
      });
      review.appendChild(list);
      card.appendChild(review);
    }

    if (data.asksForName && data.gameKey) {
      card.appendChild(receiptPanel(score, max));
    }

    var again = GP.el('button', 'gp-button', 'Play again');
    again.type = 'button';
    again.addEventListener('click', function () {
      // Reloading throws the result line away. Asking first is the only chance a student gets.
      if (document.getElementById('gp-receipt-line') && !copied) {
        if (!window.confirm('You have not copied your result line yet. Play again anyway?')) { return; }
      }
      window.location.reload();
    });
    card.appendChild(again);

    main.appendChild(card);

    // A game with its own headline says its own last word ("You win!"): "1 out of 2, have another
    // go" to a child who just beat the computer would contradict the card (UX review 2026-09-25).
    if (options && options.say) {
      characterSay(options.say, options.mood || 'happy');
      (cast ? cast.box : card).scrollIntoView({ block: 'start' });
      return;
    }

    // The score is in the card; this only cheers, so it says nothing the card does not.
    var share = max > 0 ? score / max : 0;
    characterSay(share >= 0.9 ? 'Excellent — ' + score + ' out of ' + max + '!'
      : share >= 0.6 ? 'Well played — ' + score + ' out of ' + max + '.'
      : score + ' out of ' + max + (detail && detail.length
        ? '. Look at what you missed below, then have another go.'
        : '. Have another go.'),
      share >= 0.6 ? 'happy' : 'talk');

    (cast ? cast.box : card).scrollIntoView({ block: 'start' });
  }

  function receiptPanel(score, max) {
    var line = GP.receiptLine(data.gameKey, player, data.slug, score, max, GP.today());

    var panel = GP.el('div', 'gp-receipt');
    panel.appendChild(GP.el('h3', null, 'Hand this in'));
    panel.appendChild(GP.el('p', 'gp-note',
      'Copy the line below and paste it wherever you were asked to — or take a screenshot of ' +
      'this whole panel. It records your name, this game, your score and today’s date.'));

    var box = GP.el('output', 'gp-receipt-line', line);
    box.id = 'gp-receipt-line';
    panel.appendChild(box);

    var copy = GP.el('button', 'gp-button gp-primary', 'Copy the line');
    copy.type = 'button';
    copy.addEventListener('click', function () {
      copyText(line, function (ok) {
        copied = true;
        copy.textContent = ok ? 'Copied' : 'Select the line and press Ctrl+C';
      });
    });
    panel.appendChild(copy);

    var print = GP.el('button', 'gp-button', 'Print or save as PDF');
    print.type = 'button';
    print.addEventListener('click', function () { window.print(); });
    panel.appendChild(print);

    return panel;
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      return;
    }

    // file:// in some browsers has no clipboard API; select the text so Ctrl+C works.
    var box = document.getElementById('gp-receipt-line');
    if (box && window.getSelection) {
      var range = document.createRange();
      range.selectNodeContents(box);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
    done(false);
  }

  /* --------------------------------------------------------------- exports */

  root.GP = GP;

  // So the C# tests can run these exact rules under Node.
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = GP;
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/*
 * Fill the Blank. The sentence stays on screen with the gap in it, so the student can read the
 * whole thing while they answer — a blank shown on its own is a vocabulary test, and the point of
 * this one is the context.
 *
 * When choices are on, the wrong ones are the answers to the other sentences in the same game.
 * That makes them plausible for free, and it means the teacher never types a distractor.
 */
(function () {
  'use strict';

  var GAP = '___';

  function plain(text) {
    return String(text == null ? '' : text)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')   // combining accents
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  GP.play({
    render: function (stage, data, api) {
      var settings = data.settings || {};
      var choosing = settings.showChoices === true;

      var all = (data.items || []).filter(function (item) {
        return item.sentence && item.answer;
      });

      var sentences = settings.shuffle === false ? all.slice() : GP.shuffle(all);

      var limit = Number(settings.sentencesPerRound) || 0;
      if (limit > 0 && limit < sentences.length) {
        sentences = sentences.slice(0, limit);
      }

      var at = 0;
      var score = 0;
      var detail = [];

      var card = GP.el('section', 'gp-card');
      stage.appendChild(card);

      var meta = GP.el('div', 'gp-meta');
      var label = GP.el('span', null, '');
      label.id = 'gp-progress-label';
      var bar = document.createElement('progress');
      bar.id = 'gp-progress';
      bar.max = sentences.length;
      bar.value = 0;
      meta.appendChild(label);
      meta.appendChild(bar);
      card.appendChild(meta);

      var body = GP.el('div');
      card.appendChild(body);

      show();

      /** The sentence with the gap shown as a blank, or filled in with what they answered. */
      function sentenceWith(item, filled) {
        var text = item.sentence.indexOf(GAP) >= 0 ? item.sentence : item.sentence + ' ' + GAP;
        var parts = text.split(GAP);

        var line = GP.el('p', 'gp-question');
        line.appendChild(document.createTextNode(parts[0]));
        line.appendChild(GP.el('span', 'gp-blank' + (filled ? ' gp-blank-filled' : ''),
          filled || '      '));
        line.appendChild(document.createTextNode(parts.slice(1).join(GAP)));

        return line;
      }

      function show() {
        api.progress(at, sentences.length);
        GP.clear(body);

        var item = sentences[at];
        body.appendChild(sentenceWith(item, null));

        if (choosing) {
          showChoices(item);
        } else {
          showBox(item);
        }
      }

      function showBox(item) {
        var form = GP.el('form', 'gp-gate');
        var prompt = GP.el('label', null, 'What word belongs in the blank?');
        prompt.setAttribute('for', 'gp-answer');
        form.appendChild(prompt);

        var input = GP.el('input', 'gp-text-input');
        input.id = 'gp-answer';
        input.type = 'text';
        input.autocomplete = 'off';
        input.autocapitalize = 'none';
        input.spellcheck = false;
        form.appendChild(input);

        var submit = GP.el('button', 'gp-button gp-primary', 'Check');
        submit.type = 'submit';
        form.appendChild(submit);

        var skip = GP.el('button', 'gp-button', 'I do not know — show me');
        skip.type = 'button';
        skip.addEventListener('click', function () { settle(item, false, item.answer); });
        form.appendChild(skip);

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var typed = input.value;

          if (plain(typed).length === 0) {
            api.say('Type a word, or press "I do not know" to be shown it.', 'thinking');
            input.focus();
            return;
          }

          settle(item, accepted(item).indexOf(plain(typed)) >= 0, typed);
        });

        body.appendChild(form);
        input.focus();
      }

      function showChoices(item) {
        // Three wrong answers, taken from the other sentences: plausible by construction, and the
        // teacher never has to invent one.
        var others = [];
        sentences.forEach(function (other) {
          if (other !== item && plain(other.answer) !== plain(item.answer)
              && others.indexOf(other.answer) < 0) {
            others.push(other.answer);
          }
        });

        var options = GP.shuffle([item.answer].concat(GP.shuffle(others).slice(0, 3)));

        var list = GP.el('div', 'gp-options');
        list.setAttribute('role', 'group');
        list.setAttribute('aria-label', 'Choose the missing word');

        options.forEach(function (word) {
          var button = GP.el('button', 'gp-button gp-option', word);
          button.type = 'button';
          button.addEventListener('click', function () {
            settle(item, plain(word) === plain(item.answer), word);
          });
          list.appendChild(button);
        });

        body.appendChild(list);
        var first = list.querySelector('button');
        if (first) { first.focus(); }
      }

      function accepted(item) {
        return [item.answer].concat(item.alsoAccept || [])
          .map(plain)
          .filter(function (text) { return text.length > 0; });
      }

      function settle(item, ok, said) {
        if (ok) { score++; }
        detail.push({ label: item.sentence.replace(GAP, item.answer), ok: ok });

        GP.clear(body);
        body.appendChild(sentenceWith(item, item.answer));

        var feedback = GP.el('div', 'gp-feedback ' + (ok ? 'gp-ok' : 'gp-miss'));
        feedback.appendChild(GP.el('strong', null, ok ? 'Right. ' : 'The word was "' + item.answer + '". '));
        if (!ok && said && plain(said) !== plain(item.answer)) {
          feedback.appendChild(document.createTextNode('You said "' + said + '". '));
        }
        if (item.why) {
          feedback.appendChild(document.createTextNode(item.why));
        }
        body.appendChild(feedback);
        api.say(ok ? 'Correct.' : 'The word was ' + item.answer + '.', ok ? 'happy' : 'sorry');

        var next = GP.el('button', 'gp-button gp-primary',
          at + 1 < sentences.length ? 'Next sentence' : 'See my result');
        next.type = 'button';
        next.addEventListener('click', function () {
          at++;
          if (at < sentences.length) {
            show();
          } else {
            api.progress(sentences.length, sentences.length);
            api.finish(score, sentences.length, detail);
          }
        });
        body.appendChild(next);
        next.focus();
      }
    }
  });
})();
</script>
</body>
</html>
